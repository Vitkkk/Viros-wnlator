name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
    paths:
      - '.github/workflows/build-debug-apk.yml'
      - 'scripts/**'
      - 'patches/**'
      - 'overlay/**'
      - 'docs/UPSTREAM.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Viros repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;24.0.8215888' \
            'cmake;3.22.1'

      - name: Prepare pinned Winlator source
        shell: bash
        run: |
          chmod +x scripts/prepare-source.sh
          ./scripts/prepare-source.sh

      - name: Build debug APK
        working-directory: .work/winlator-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viros-winlator-debug
          path: .work/winlator-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
